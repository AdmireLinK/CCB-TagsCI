name: Update Extra Tags

on:
  schedule:
    # 北京时间每周一凌晨 4:00 执行 (UTC 时间每周日 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  update-tags:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout CCB-TagsCI
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        working-directory: ./character_tags_crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run all extra tags crawlers
        env:
          PYTHONPATH: .
        run: |
          python extra_tags_crawler/run_all.py
      
      - name: Commit and push outputs to CCB-TagsCI
        run: |
          git config user.name "AdmireLinK"
          git config user.email "AdmireLinK@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "CI：extra_tags update"
          git push

      - name: Checkout Guesser Repository
        uses: actions/checkout@v4
        with:
          repository: AdmireLinK/anime-character-guessr
          token: ${{ secrets.CI_TOKEN }}
          path: anime-character-guessr

      - name: Copy outputs to Guesser Repository
        run: |
          # 创建目标文件夹以防不存在
          mkdir -p anime-character-guessr/client/public/data/extra_tags
          mkdir -p anime-character-guessr/client/public/assets/extra_tags
          
          # 复制 JSON 配置文件
          cp -r outputs/extra_tags/*.json anime-character-guessr/client/public/data/extra_tags/
          
          # 复制静态图片资产
          cp -r outputs/assets/extra_tags/* anime-character-guessr/client/public/assets/extra_tags/

      - name: Commit and Push to Guesser Repository
        working-directory: ./anime-character-guessr
        run: |
          git config user.name "AdmireLinK"
          git config user.email "AdmireLinK@users.noreply.github.com"
          git add client/public/data/extra_tags/
          git add client/public/assets/extra_tags/
          git diff --staged --quiet || git commit -m "CI：extra_tags update"
          git push
