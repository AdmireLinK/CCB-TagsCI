name: Merge User Feedback Tags

on:
  schedule:
    # 北京时间每周一至周日凌晨 4:00 执行 (UTC 时间每日 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-feedback:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout CCB-TagsCI
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN }}
      
      - name: Checkout Guesser Repository
        uses: actions/checkout@v4
        with:
          repository: AdmireLinK/anime-character-guessr
          token: ${{ secrets.CI_TOKEN }}
          path: anime-character-guessr
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo python-dotenv
      
      - name: Run Evaluation Merge
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python character_tags_evaluation/run_merge.py
      
      - name: Commit and push outputs to CCB-TagsCI
        run: |
          git config user.name "AdmireLinK"
          git config user.email "AdmireLinK@users.noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "CI：user feedback tags update"
          git push
 
      - name: Copy outputs to Guesser Repository
        run: |
          # 创建目标文件夹以防不存在
          mkdir -p anime-character-guessr/client/src/data/
          
          # 复制合并后的 JS 文件到 guesser 的数据路径
          cp outputs/id_tags.js anime-character-guessr/client/src/data/id_tags.js

      - name: Commit and Push to Guesser Repository
        working-directory: ./anime-character-guessr
        run: |
          git config user.name "AdmireLinK"
          git config user.email "AdmireLinK@users.noreply.github.com"
          git add client/src/data/id_tags.js
          git diff --staged --quiet || git commit -m "CI：id_tags auto update"
          git push
