name: Merge User Feedback Tags

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CI_TOKEN:
        required: true
      MONGODB_URI:
        required: true

permissions:
  contents: write

env:
  GUESSER_BRANCH: main

jobs:
  merge-feedback:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout CCB-TagsCI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.CI_TOKEN }}
      
      - name: Checkout Guesser Repository
        uses: actions/checkout@v7
        with:
          repository: Cosmosuperbaka/anime-character-guessr
          ref: main
          token: ${{ secrets.CI_TOKEN }}
          path: anime-character-guessr
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo python-dotenv
      
      - name: Run Evaluation Merge
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python character_tags_evaluation/run_merge.py
      
      - name: Commit and push outputs to CCB-TagsCI
        run: |
          git config user.name "Cosmosuperbaka"
          git config user.email "Cosmosuperbaka@users.noreply.github.com"
          git add outputs/
          if ! git diff --staged --quiet; then
            git commit -m "CI：id_tags auto update"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No id tag changes for CCB-TagsCI."
          fi
 
      - name: Copy outputs to Guesser Repository
        run: |
          # 创建目标文件夹以防不存在
          mkdir -p anime-character-guessr/client/src/data/
          
          # 复制合并后的 JS 文件到 guesser 的数据路径
          cp outputs/id_tags.js anime-character-guessr/client/src/data/id_tags.js

      - name: Commit and Push to Guesser Repository
        working-directory: ./anime-character-guessr
        run: |
          git config user.name "Cosmosuperbaka"
          git config user.email "Cosmosuperbaka@users.noreply.github.com"
          git add client/src/data/id_tags.js
          if ! git diff --staged --quiet; then
            git commit -m "CI：id_tags auto update"
            git fetch origin "$GUESSER_BRANCH"
            git rebase FETCH_HEAD
            git push origin "HEAD:$GUESSER_BRANCH"
          else
            echo "No id tag changes for Guesser Repository."
          fi
